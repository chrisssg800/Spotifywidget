<!DOCTYPE html>
<html lang="en">
<head>
	<title>Spotify Widget</title>
	<meta charset="UTF-8">
	<link rel="shortcut icon" href="#" />
	<link rel="stylesheet" href="./style.css" />
</head>

<body>
	<div id="mainContainer">
		<div id="albumArtBox">
			<img id="albumArt" src="./logo.png">
			<img id="albumArtBack" src="./logo.png">
		</div>
		<div id="songInfoBox">
			<div id="songInfo">
				<div id="IAmRunningOutOfNamesForTheseBoxes">
					<div id="songLabel"></div>
					<div id="artistLabel"></div>
					<div id="times">
						<div id="progressTime">0:00</div>
						<div id="timeRemaining">-0:00</div>
					</div>
					<div id="progressBg">
						<div id="progressBar"></div>
					</div>
				</div>
			</div>
			<div id="backgroundArt">
				<img id="backgroundImage" src="./logo.png">
				<img id="backgroundImageBack" src="./logo.png">
			</div>
		</div>
	</div>
</body>

<script src="./script.js"></script>
</html>
