<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify Now Playing</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="mainContainer">
    <div id="albumArtBox">
      <img id="streamerLogo" src="./logo.png" alt="Logo">
    </div>

    <div id="songInfoBox">
      <div id="songInfo">
        <div id="textArea">
          <div id="songLabel"></div>
          <div id="artistLabel"></div>
          <div id="times">
            <div id="progressTime">0:00</div>
            <div id="timeRemaining">-0:00</div>
          </div>
          <div id="progressBg"><div id="progressBar"></div></div>
        </div>
      </div>

      <div id="backgroundArt">
        <img id="backgroundImage" src="./logo.png" alt="">
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
